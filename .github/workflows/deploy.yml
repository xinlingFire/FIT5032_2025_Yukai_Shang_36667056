name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'Assessed Lab 5/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
      VITE_COUNT_BOOKS_URL: ${{ vars.VITE_COUNT_BOOKS_URL }}

    defaults:
      run:
        working-directory: Assessed Lab 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Assessed Lab 5/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Preserve Vue routes on GitHub Pages
        run: cp dist/index.html dist/404.html

      # The deploy action's rsync command cannot safely handle the project's spaced path.
      - name: Prepare deployment files
        run: cp -R dist ../pages-dist

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@4.1.4
        with:
          branch: gh-pages
          folder: pages-dist
          clean: true
